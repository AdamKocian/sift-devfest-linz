# OpenTelemetry Collector (contrib) -> Dynatrace over OTLP/HTTP.
#
# Follows https://docs.dynatrace.com/docs/ingest-from/opentelemetry/collector/configuration
# - Dynatrace accepts OTLP over HTTP with protobuf only (no gRPC, no JSON):
#   https://docs.dynatrace.com/docs/ingest-from/opentelemetry/otlp-api
# - Endpoint: https://<env-id>.live.dynatrace.com/api/v2/otlp (+ /v1/traces|metrics|logs)
# - Auth: "Authorization: Bearer <platform token>" with the scopes
#   openpipeline:traces:ingest, openpipeline:metrics:ingest, openpipeline:logs:ingest
# - Metrics must be delta; cumulative_to_delta converts what is not.
# TODO(verify): run `otelcol-contrib validate --config=infra/otel-collector/dynatrace.yaml`
# (not run yet: no collector binary or Docker on the dev machine). The component names
# `otlp_http` and `cumulative_to_delta` are the ones the Dynatrace page uses.
#
# Sift's OTel rules (filter / transform / log_dedup / count) are added to the
# `processors` lists below by the apply engine in phase 04.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  cumulative_to_delta:
    max_staleness: 25h
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  otlp_http:
    endpoint: "${env:DT_ENV_URL}/api/v2/otlp"
    headers:
      Authorization: "Bearer ${env:DT_API_TOKEN}"
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, cumulative_to_delta, batch]
      exporters: [otlp_http]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http]
