# Local collector without a tenant: prints what it receives (debug exporter) and keeps
# a copy as OTLP JSON lines in ./out, so rule effects can be compared before/after.
# TODO(verify): run `otelcol-contrib validate --config=infra/otel-collector/debug.yaml`.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch: {}

exporters:
  debug:
    verbosity: basic
  file:
    path: /out/telemetry.jsonl
    rotation:
      max_megabytes: 50
      max_backups: 2

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, file]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, file]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, file]
