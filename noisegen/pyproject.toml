[project]
name = "noisegen"
version = "0.1.0"
description = "Deterministic noisy-shop telemetry with planted waste, sent over OTLP"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
noisegen = "noisegen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noisegen"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "SIM"]
