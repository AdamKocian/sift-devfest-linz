[project]
name = "sift-mcp"
version = "0.1.0"
description = "Sift MCP server: telemetry waste report and proposals over MCP (stdio and streamable HTTP)"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",  # same SDK version as the Sift server; FastMCP is MCPServer in mcp 2
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
sift-mcp = "sift_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sift_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "SIM"]
